[pytest]
testpaths = tests
# Si el terminal tiene hecho `source /opt/ros/humble/setup.bash`, PYTHONPATH apunta a los plugins
# de pytest de ROS (Python 3.10), que no cargan en el Python 3.12 de Isaac y tumban pytest al
# arrancar. Se bloquean por nombre; sin ROS en el entorno estas opciones no hacen nada.
addopts =
    -p no:launch_testing
    -p no:launch_ros
    -p no:ament_copyright
    -p no:ament_flake8
    -p no:ament_lint
    -p no:ament_pep257
    -p no:ament_xmllint
